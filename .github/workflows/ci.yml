name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: cargo test (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - issuer-registry
          - reputation-registry
          - marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.contract }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.contract }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.contract)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.contract }}-

      - name: Run tests
        working-directory: ${{ matrix.contract }}
        run: cargo test
